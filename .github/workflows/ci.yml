name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Backend Tests & Checks
  backend:
    name: Backend (Python/FastAPI)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: accessgraph_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/backend/requirements.txt

      # WeasyPrint's system libraries (as in apps/backend/Dockerfile), so the PDF and
      # image-pack rendering tests run instead of skipping.
      - name: Install PDF rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b fonts-dejavu-core

      - name: Install dependencies
        working-directory: apps/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Ruff and mypy don't stop the job, so the tests always run; the last
      # step fails the job if either of them failed.
      - name: Lint with Ruff
        id: ruff
        working-directory: apps/backend
        run: ruff check .
        continue-on-error: true

      # Fails only on mypy errors that aren't in mypy-baseline.txt (the errors
      # on 18 Oct 2026); after fixing some, re-save it with --update.
      - name: Type check with mypy (new errors only)
        id: mypy
        working-directory: apps/backend
        run: python scripts/mypy_baseline.py
        continue-on-error: true

      - name: Run tests
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/accessgraph_test
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: test
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/ --cov=app --cov-report=xml --cov-report=term

      - name: Fail if Ruff or mypy failed
        if: always() && (steps.ruff.outcome == 'failure' || steps.mypy.outcome == 'failure')
        run: |
          echo "Ruff: ${{ steps.ruff.outcome }}, mypy: ${{ steps.mypy.outcome }}"
          exit 1

  # Frontend Tests & Checks
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        working-directory: apps/frontend
        run: npm run type-check

      # As in the backend job: lint doesn't stop the unit tests or the build;
      # the last step fails the job if it failed.
      - name: Lint
        id: lint
        working-directory: apps/frontend
        run: npm run lint -- --max-warnings 0
        continue-on-error: true

      - name: Unit tests
        working-directory: apps/frontend
        run: npx vitest run

      - name: Build
        working-directory: apps/frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

      - name: Fail if lint failed
        if: always() && steps.lint.outcome == 'failure'
        run: |
          echo "Lint: ${{ steps.lint.outcome }}"
          exit 1

  # Shared Packages
  packages:
    name: Shared Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check shared-types
        working-directory: packages/shared-types
        run: npm run type-check

      - name: Type check shared-config
        working-directory: packages/shared-config
        run: npm run type-check

      - name: Build packages
        run: npm run build:packages
        continue-on-error: true
